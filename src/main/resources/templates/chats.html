<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Private Chat</title>

  <!-- ✅ Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- ✅ SockJS + STOMP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body class="bg-gradient-to-br from-gray-900 via-indigo-900 to-black text-white h-screen overflow-hidden font-sans">

  <!-- Header -->
  <header class="flex items-center justify-between px-4 py-4 md:px-6 bg-black/70 backdrop-blur border-b border-white/10">
    <div class="flex items-center space-x-2 md:space-x-3">
      <div id="userAvatar" class="w-8 h-8 md:w-10 md:h-10 bg-gradient-to-tr from-indigo-500 to-purple-600 rounded-full flex items-center justify-center font-bold text-xs md:text-base shadow-md"></div>
      <h4 class="text-sm md:text-lg font-semibold" th:text="${name}"></h4>
    </div>
    <div id="toast" class="hidden fixed top-4 left-4 right-4 md:left-auto md:right-5 bg-red-500 text-white px-3 py-2 md:px-4 md:py-2 rounded shadow-lg z-50 text-center text-sm md:text-base"></div>
  </header>

  <!-- Chat Container -->
  <div id="appContainer" class="max-w-6xl mx-auto mt-4 md:mt-6 bg-white/5 border border-white/10 rounded-lg shadow-lg backdrop-blur h-[85vh] md:h-[85vh] flex flex-col md:flex-row overflow-hidden">

    <!-- User List -->
    <aside id="userList" class="w-full md:w-60 p-3 md:p-4 border-r border-white/10 overflow-y-auto space-y-2 md:space-y-3 bg-black/50">
      <h3 class="text-base md:text-xl font-semibold border-b border-indigo-400 pb-1 md:pb-2">Users</h3>
      <div th:each="user : ${users}">
        <div 
          class="user cursor-pointer px-2 py-1 md:px-3 md:py-2 rounded-lg bg-white/10 hover:bg-indigo-600 hover:text-white transition relative text-sm md:text-base" 
          th:text="${user.id}" 
          th:attr="data-id=${user.id}">
        </div>
      </div>
    </aside>

    <!-- Chat Area -->
    <main id="chatBox" class="flex-1 flex flex-col p-3 md:p-4 space-y-3 md:space-y-4 bg-black/40">
      <h3 id="chatWith" class="text-base md:text-lg font-bold border-b border-indigo-500 pb-1 md:pb-1">Select a user to chat</h3>
      
      <!-- Messages -->
      <div id="messages" class="flex flex-col overflow-y-auto space-y-2 p-2 border border-white/10 rounded-lg bg-white/5 scroll-smooth h-full"></div>

      <!-- Input Box -->
      <div id="inputBox" class="flex flex-col md:flex-row gap-2 md:gap-3">
        <input id="messageInput" type="text" placeholder="Type your message" autocomplete="off"
          class="flex-1 px-3 py-2 md:px-4 md:py-2 rounded-full bg-white/10 border border-white/20 placeholder-gray-400 text-white text-sm md:text-base focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        <button onclick="sendMessage()"
          class="px-4 py-2 md:px-6 md:py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-full shadow transition text-sm md:text-base w-full md:w-auto mt-2 md:mt-0">
          Send
        </button>
      </div>
    </main>
  </div>

  <!-- JS Logic -->
  <script>
    let stompClient = null;
    let currentRecipient = null;
    let reconnectDelay = 5000;
    let isReconnecting = false;

    function connect() {
      const socket = new SockJS('/ws');
      stompClient = Stomp.over(socket);
      stompClient.debug = null;

      stompClient.connect({}, function (frame) {
        console.log('✅ Connected: ' + frame);
        isReconnecting = false;

        stompClient.subscribe('/user/queue/messages', function (messageOutput) {
          const msg = JSON.parse(messageOutput.body);
          const userDiv = document.querySelector(`[data-id="${msg.sender}"]`);

          if (!currentRecipient || msg.sender !== currentRecipient) {
            const toast = document.getElementById('toast');
            const truncatedContent = msg.content.length > 50 ? msg.content.substring(0, 50) + '...' : msg.content;
            toast.textContent = `New message from ${msg.sender}: ${truncatedContent}`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 2500);

            if (userDiv) userDiv.classList.add('bg-red-500');
          } else {
            if (userDiv) userDiv.classList.remove('bg-red-500');
            showMessage(msg.sender + ': ' + msg.content, msg);
          }
        });
      }, function (error) {
        console.warn('⚠️ STOMP error: Lost connection.', error);
        if (!isReconnecting) {
          isReconnecting = true;
          console.log('⏳ Reconnecting in 5 seconds...');
          setTimeout(connect, reconnectDelay);
        }
      });
    }

    window.addEventListener('load', function () {
      const nameElement = document.querySelector('h4');
      if (nameElement && nameElement.textContent) {
        const firstChar = nameElement.textContent.charAt(0).toUpperCase();
        document.getElementById('userAvatar').textContent = firstChar;
      }
      connect();

      document.getElementById('messageInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') sendMessage();
      });
    });

    document.getElementById('userList').addEventListener('click', function (e) {
      if (e.target.classList.contains('user')) {
        const username = e.target.dataset.id;
        currentRecipient = username;
        document.getElementById('chatWith').innerText = 'Chat with ' + e.target.innerText;
        document.getElementById('messages').innerHTML = '';
        e.target.classList.remove('bg-red-500');
      }
    });

    function sendMessage() {
      const content = document.getElementById('messageInput').value.trim();
      if (!currentRecipient) {
        alert('Select a user first!');
        return;
      }
      if (content === '') return;

      stompClient.send("/app/chat.private", {}, JSON.stringify({
        to: currentRecipient,
        content: content
      }));

      showMessage(content);  // Simplified to just show content for "me"
      document.getElementById('messageInput').value = '';
    }

    function showMessage(text, msg) {
      const messagesDiv = document.getElementById('messages');
      const p = document.createElement('p');
      p.textContent = text;
      p.className = "px-3 py-2 rounded-2xl max-w-[75%] break-words border backdrop-blur-sm text-sm md:text-base";
      
      if (msg && msg.sender === currentRecipient) {
        p.classList.add('bg-white/10', 'self-start', 'text-white');
      } else {
        p.classList.add('bg-indigo-600', 'self-end', 'text-white');
      }
      
      messagesDiv.appendChild(p);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
  </script>
</body>
</html>
