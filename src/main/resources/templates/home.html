<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Chat - [[${channelName}]]</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
    }

    /* Prevent mobile keyboard from hiding input */
    @media (max-width: 768px) {
      footer {
        position: sticky;
        bottom: 0;
        background-color: rgba(0, 0, 0, 0.7);
        z-index: 50;
      }
    }
  </style>
</head>

<body class="h-screen flex flex-col text-white font-sans overflow-hidden">

  <!-- Header -->
  <header class="flex justify-between items-center px-4 py-3 bg-black bg-opacity-70 border-b border-white/10 shadow z-10">
    <h1 class="text-lg font-semibold">
      Channel: <span class="text-indigo-400 font-bold" th:text="${channelName}">channel</span>
    </h1>
    <div class="text-sm text-gray-400">User: <span class="text-white" th:text="${userName}">user</span></div>
    <form action="/exit" method="POST" class="m-0">
      <input type="hidden" name="channelname" th:value="${channelName}" />
      <button type="submit" class="bg-red-500 hover:bg-red-600 text-white px-4 py-1 rounded shadow text-sm">
        Exit
      </button>
    </form>
    <form action="/share" method="POST" class="m-0">
      <input type="hidden" name="channelname" th:value="${channelName}" />
      <button type="submit" class="bg-green-500 hover:bg-green-600 text-white px-4 py-1 rounded shadow text-sm">
        Share
      </button>
    </form>
  </header>

  <!-- Chat Container -->
  <main id="chatContainer" class="flex-1 min-h-0 overflow-y-auto p-4 space-y-4 bg-black bg-opacity-40">
    <div id="messages" class="flex flex-col space-y-3"></div>
    <div id="showtext" class="text-sm text-gray-300 italic hidden">
      <p th:text="${userName + ' is typing...'}">Someone is typing...</p>
    </div>
  </main>

  <!-- Hidden Inputs -->
  <input type="hidden" id="userName" th:value="${userName}" />
  <input type="hidden" id="channelName" th:value="${channelName}" />

  <!-- Footer -->
  <footer class="flex items-center gap-3 px-4 py-3 border-t border-white/10 pb-[env(safe-area-inset-bottom)] bg-black bg-opacity-70">
    <input id="content" type="text" maxlength="500" placeholder="Type your message..."
      class="flex-1 px-4 py-2 rounded-full bg-white/10 border border-white/20 text-white focus:outline-none focus:ring-2 focus:ring-indigo-400"
    />
    <button id="sendBtn"
      class="shrink-0 bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-600 hover:to-purple-600 text-white font-semibold px-4 py-2 rounded-full shadow-md disabled:opacity-50 disabled:cursor-not-allowed"
      disabled>Send</button>
  </footer>

  <!-- JS Logic -->
  <script>
    const channelName = document.getElementById('channelName').value || 'defaultChannel';
    const userName = document.getElementById('userName').value || 'Anonymous';
    let stompClient = null;

    function scrollToBottom() {
      const messagesDiv = document.getElementById('messages');
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    document.getElementById('content').addEventListener('input', () => {
      if (stompClient && stompClient.connected) {
        stompClient.send("/app/typing", {}, JSON.stringify({ from: userName, channelName }));
      }
    });

    function connect() {
      const socket = new SockJS('/ws');
      stompClient = Stomp.over(socket);
      stompClient.connect({}, function (frame) {
        console.log('Connected: ' + frame);
        document.getElementById('sendBtn').disabled = false;

        stompClient.subscribe('/topic/messages/' + channelName, function (message) {
          if (userName !== JSON.parse(message.body).from) {
            document.getElementById('showtext').classList.add('hidden');
          }
          showMessage(JSON.parse(message.body));
        });

        stompClient.subscribe('/topic/join' + channelName, function (message) {
          showJoinMessage(JSON.parse(message.body));
        });

        stompClient.subscribe('/topic/exit' + channelName, function (message) {
          showExitMessage(message.body);
        });

        stompClient.subscribe('/topic/typing/' + channelName, function (message) {
          const typingInfo = JSON.parse(message.body);
          if (typingInfo.from !== userName) {
            document.getElementById('showtext').classList.remove('hidden');
            document.querySelector('#showtext p').textContent = `${typingInfo.from} is typing...`;

            setTimeout(() => {
              document.getElementById('showtext').classList.add('hidden');
            }, 3000);
          }
        });
      }, function (error) {
        console.error('Connection error:', error);
        document.getElementById('sendBtn').disabled = true;
      });
    }

    function sendMessage() {
      const contentInput = document.getElementById('content');
      const content = contentInput.value.trim();

      if (!content) {
        return;
      }

      const message = {
        channelName,
        content,
        from: userName
      };

      if (stompClient && stompClient.connected) {
        stompClient.send("/app/send", {}, JSON.stringify(message));
        contentInput.value = '';
        contentInput.focus();
      } else {
        console.error("Not connected to chat server.");
      }
    }

    function showMessage(message) {
      const messagesDiv = document.getElementById('messages');
      const isOwn = message.from === userName;

      const msgDiv = document.createElement('div');
      msgDiv.className = `max-w-[80%] ${isOwn ? 'self-end' : 'self-start'} flex flex-col`;

      msgDiv.innerHTML = `
        <div class="bg-white/10 border border-white/20 p-3 rounded-2xl shadow-md hover:shadow-lg transition">
          <div class="text-xs text-indigo-300 font-semibold mb-1">${message.from}</div>
          <div class="text-sm text-white break-words">${message.content}</div>
        </div>
      `;

      messagesDiv.appendChild(msgDiv);
      scrollToBottom();
    }

    function showJoinMessage(message) {
      const messagesDiv = document.getElementById('messages');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'self-center text-green-400 text-sm italic';
      msgDiv.textContent = `${message.user} joined`;
      messagesDiv.appendChild(msgDiv);
      scrollToBottom();
    }

    function showExitMessage(message) {
      const messagesDiv = document.getElementById('messages');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'self-center text-red-500 text-sm italic';
      msgDiv.textContent = message;
      messagesDiv.appendChild(msgDiv);
      scrollToBottom();
    }

    document.getElementById('sendBtn').addEventListener('click', sendMessage);
    document.getElementById('content').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') sendMessage();
    });

    connect();
  </script>
</body>

</html>
